# Compose profile `observability`. Prometheus scrapes the web app over the Compose network with METRICS_TOKEN
# (written to /tmp/metrics_token by the container command, so the token is not stored in this file).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fashion-web
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['web:3000']
